<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顏色記憶挑戰</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; color: #e94560; }
    .subtitle { color: #888; margin-bottom: 30px; }

    .phase-title {
      font-size: 24px;
      margin-bottom: 20px;
      color: #0f3460;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
    }

    .colors-display {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }
    .color-box {
      aspect-ratio: 1;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .color-box:hover { transform: scale(1.05); }

    .timer {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      color: #e94560;
      margin-bottom: 20px;
    }

    .inputs-section {
      display: none;
    }
    .inputs-section.active { display: block; }

    .color-inputs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }
    .color-input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .color-input-group label {
      font-size: 12px;
      color: #888;
    }
    .color-preview {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 3px solid #333;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .color-preview:hover { border-color: #667eea; }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      margin-bottom: 10px;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .btn-secondary {
      background: #2d2d44;
      color: #fff;
    }

    .results { display: none; }
    .results.active { display: block; }

    .result-row {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #2d2d44;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .result-original, .result-user {
      width: 50px;
      height: 50px;
      border-radius: 8px;
    }
    .result-info { flex: 1; }
    .result-label { font-size: 12px; color: #888; }
    .result-score { font-size: 24px; font-weight: bold; color: #e94560; }
    .result-diff { font-size: 12px; color: #888; }

    .total-score {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin: 30px 0;
      color: #667eea;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>🎨 顏色記憶挑戰</h1>
  <p class="subtitle">你有 30 秒記憶 5 個顏色，然後試著重現它們！</p>

  <div class="game-container">
    <!-- 記憶階段 -->
    <div id="memorizePhase">
      <h2 class="phase-title">記住這些顏色！</h2>
      <div class="colors-display" id="colorsDisplay"></div>
      <div class="timer" id="timer">30</div>
      <button class="btn btn-secondary" id="skipBtn">我記住了 →</button>
    </div>

    <!-- 答題階段 -->
    <div class="inputs-section" id="inputPhase">
      <h2 class="phase-title">重現顏色！</h2>
      <div class="color-inputs" id="colorInputs"></div>
      <button class="btn btn-primary" id="submitBtn">提交答案</button>
    </div>

    <!-- 結果階段 -->
    <div class="results" id="resultPhase">
      <h2 class="phase-title">你的成績</h2>
      <div id="resultDetails"></div>
      <div class="total-score" id="totalScore"></div>
      <button class="btn btn-primary" id="playAgainBtn">再玩一次</button>
    </div>
  </div>

  <script>
    // 遊戲狀態
    let colors = [];
    let userColors = [];
    let timerInterval;

    // 初始化遊戲
    function initGame() {
      colors = [];
      userColors = [];
      
      // 產生 5 個隨機顏色 (HSB 格式)
      for (let i = 0; i < 5; i++) {
        const h = Math.floor(Math.random() * 360);
        const s = 70 + Math.floor(Math.random() * 30); // 70-100%
        const b = 70 + Math.floor(Math.random() * 25); // 70-95%
        colors.push({ h, s, b });
      }

      showMemorizePhase();
    }

    // 顯示記憶階段
    function showMemorizePhase() {
      document.getElementById('memorizePhase').classList.remove('hidden');
      document.getElementById('inputPhase').classList.remove('active');
      document.getElementById('resultPhase').classList.remove('active');

      const display = document.getElementById('colorsDisplay');
      display.innerHTML = '';
      colors.forEach((c, i) => {
        const box = document.createElement('div');
        box.className = 'color-box';
        box.style.background = `hsl(${c.h}, ${c.s}%, ${c.b}%)`;
        box.style.animationDelay = `${i * 0.1}s`;
        display.appendChild(box);
      });

      let time = 30;
      document.getElementById('timer').textContent = time;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        time--;
        document.getElementById('timer').textContent = time;
        if (time <= 0) {
          clearInterval(timerInterval);
          showInputPhase();
        }
      }, 1000);
    }

    // 顯示答題階段
    function showInputPhase() {
      document.getElementById('memorizePhase').classList.add('hidden');
      document.getElementById('inputPhase').classList.add('active');
      document.getElementById('resultPhase').classList.remove('active');

      const container = document.getElementById('colorInputs');
      container.innerHTML = '';
      userColors = [];

      colors.forEach((_, i) => {
        const h = Math.floor(Math.random() * 360);
        const s = 80;
        const b = 80;
        userColors.push({ h, s, b });

        const group = document.createElement('div');
        group.className = 'color-input-group';
        group.innerHTML = `
          <label>顏色 ${i + 1}</label>
          <input type="color" class="color-preview" data-index="${i}" value="${hslToHex(h, s, b)}">
        `;
        container.appendChild(group);
      });

      container.querySelectorAll('input[type="color"]').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.index);
          const hex = e.target.value;
          const hsl = hexToHsl(hex);
          userColors[idx] = hsl;
        });
      });
    }

    // 顯示結果階段
    function showResultPhase() {
      document.getElementById('memorizePhase').classList.add('hidden');
      document.getElementById('inputPhase').classList.remove('active');
      document.getElementById('resultPhase').classList.add('active');

      const container = document.getElementById('resultDetails');
      container.innerHTML = '';
      let totalScore = 0;

      colors.forEach((orig, i) => {
        const user = userColors[i];
        const diff = colorDistance(orig, user);
        const score = Math.max(0, Math.round((1 - diff / 100) * 50));
        totalScore += score;

        const row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = `
          <div class="result-original" style="background: hsl(${orig.h}, ${orig.s}%, ${orig.b}%)"></div>
          <div class="result-user" style="background: hsl(${user.h}, ${user.s}%, ${user.b}%)"></div>
          <div class="result-info">
            <div class="result-label">顏色 ${i + 1}</div>
            <div class="result-diff">誤差: ${Math.round(diff)}%</div>
          </div>
          <div class="result-score">${score}/50</div>
        `;
        container.appendChild(row);
      });

      document.getElementById('totalScore').textContent = `總分: ${totalScore}/250`;
    }

    // 計算兩個 HSB 顏色的距離
    function colorDistance(c1, c2) {
      const dh = Math.min(Math.abs(c1.h - c2.h), 360 - Math.abs(c1.h - c2.h)) / 180;
      const ds = Math.abs(c1.s - c2.s) / 100;
      const db = Math.abs(c1.b - c2.b) / 100;
      return Math.sqrt(dh * dh + ds * ds + db * db) * 100;
    }

    // HSL to Hex 轉換
    function hslToHex(h, s, l) {
      l /= 100;
      const a = s * Math.min(l, 1 - l) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    // Hex to HSL 轉換
    function hexToHsl(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;

      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }

      return { h: Math.round(h * 360), s: Math.round(s * 100), b: Math.round(l * 100) };
    }

    // 事件監聽
    document.getElementById('skipBtn').addEventListener('click', () => {
      clearInterval(timerInterval);
      showInputPhase();
    });

    document.getElementById('submitBtn').addEventListener('click', showResultPhase);
    document.getElementById('playAgainBtn').addEventListener('click', initGame);

    // 啟動遊戲
    initGame();
  </script>
</body>
</html>
